services:
  postgres:
    image: postgres:16-alpine
    container_name: aurora-postgres
    environment:
      POSTGRES_USER: aurora
      POSTGRES_PASSWORD: aurora
      POSTGRES_DB: aurora_fibra
    ports:
      - "5432:5432"
    volumes:
      - ./data/seed_aurora.sql:/docker-entrypoint-initdb.d/01_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurora -d aurora_fibra"]
      interval: 5s
      timeout: 3s
      retries: 10

  toolbox:
    image: us-central1-docker.pkg.dev/database-toolbox/toolbox/toolbox:latest
    container_name: aurora-toolbox
    depends_on:
      postgres:
        condition: service_healthy
    # O entrypoint da imagem já é o binário toolbox, então o command
    # passa só as flags. Repetir "toolbox" aqui derruba o container.
    command: ["--tools-file", "/config/tools.yaml", "--address", "0.0.0.0", "--port", "5000"]
    ports:
      - "5000:5000"
    volumes:
      - ./lab04_mcp_toolbox/tools.yaml:/config/tools.yaml:ro
    environment:
      # o tools.yaml lê estas variáveis, nenhuma senha fica versionada
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: aurora_fibra
      POSTGRES_USER: aurora
      POSTGRES_PASSWORD: aurora

  mock_api:
    image: python:3.12-slim
    container_name: aurora-mock-api
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir fastapi uvicorn &&
             uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./mock_api:/app:ro
